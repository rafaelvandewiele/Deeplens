<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepLens — AI Content Detector</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ─── HEADER ────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-group">
        <img src="/logo.svg" alt="DeepLens logo" class="logo-img" />
        <div>
          <h1 class="logo-text">DeepLens</h1>
          <p class="tagline">AI Content Detector</p>
        </div>
      </div>
      <nav class="header-nav">
        <a href="https://github.com" target="_blank" class="nav-link" id="gh-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </a>
      </nav>
    </div>
  </header>

  <!-- ─── MAIN ──────────────────────────────────────────────── -->
  <main>

    <!-- Upload zone -->
    <section class="upload-section" id="upload-section">
      <div class="upload-zone" id="drop-zone">
        <div class="upload-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <p class="upload-title">Drop an image or video here</p>
        <p class="upload-sub">or click to browse</p>
        <p class="upload-formats">JPEG, PNG, WebP, BMP, TIFF, MP4, MOV, AVI, WebM, MKV</p>
        <input type="file" id="file-input" accept="image/*,video/*" hidden />
      </div>

      <!-- Preview thumbnail (hidden until file chosen) -->
      <div class="preview-container" id="preview-container" style="display:none">
        <img id="preview-img" class="preview-thumb" alt="Preview" />
        <video id="preview-vid" class="preview-thumb" controls style="display:none"></video>
        <div class="preview-meta">
          <span id="preview-name" class="preview-name"></span>
          <span id="preview-size" class="preview-size"></span>
          <button class="btn-change" id="btn-change">Change file</button>
        </div>
      </div>
    </section>

    <!-- Analyse button -->
    <section class="action-section" id="action-section" style="display:none">
      <button class="btn-analyse" id="btn-analyse">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Analyse
      </button>
    </section>

    <!-- Progress -->
    <section class="progress-section" id="progress-section" style="display:none">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="progress-text" id="progress-text">Analysing&hellip;</p>
    </section>

    <!-- Results -->
    <section class="results-section" id="results-section" style="display:none">

      <!-- Verdict banner -->
      <div class="verdict-banner" id="verdict-banner">
        <div class="verdict-icon" id="verdict-icon"></div>
        <div>
          <h2 class="verdict-text" id="verdict-text"></h2>
          <p class="verdict-sub" id="verdict-sub"></p>
        </div>
        <div class="score-ring" id="score-ring">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" class="ring-bg"/>
            <circle cx="60" cy="60" r="52" class="ring-fill" id="ring-fill"/>
          </svg>
          <span class="ring-label" id="ring-label"></span>
        </div>
      </div>

      <!-- File info -->
      <div class="info-bar" id="info-bar"></div>

      <!-- Preview -->
      <div class="result-preview-wrap" id="result-preview-wrap" style="display:none">
        <img id="result-preview-img" class="result-preview" alt="Analysed image" />
        <video id="result-preview-vid" class="result-preview" controls style="display:none"></video>
      </div>

      <!-- Analysis cards -->
      <div class="cards-grid" id="cards-grid"></div>

    </section>

  </main>

  <!-- ─── FOOTER ────────────────────────────────────────────── -->
  <footer class="site-footer">
    <p>DeepLens v1.0 &mdash; heuristic analysis for educational purposes. Not a guarantee of detection.</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
