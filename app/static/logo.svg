<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="g2" x1="64" y1="10" x2="64" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="64" cy="64" r="58" stroke="url(#g1)" stroke-width="5" fill="none"/>

  <!-- inner filled circle -->
  <circle cx="64" cy="64" r="48" fill="url(#g2)"/>

  <!-- aperture blades -->
  <g stroke="url(#g1)" stroke-width="2.2" stroke-linecap="round" fill="none">
    <line x1="64" y1="18" x2="64" y2="36"/>
    <line x1="64" y1="92" x2="64" y2="110"/>
    <line x1="18" y1="64" x2="36" y2="64"/>
    <line x1="92" y1="64" x2="110" y2="64"/>
    <line x1="31" y1="31" x2="44" y2="44"/>
    <line x1="84" y1="84" x2="97" y2="97"/>
    <line x1="97" y1="31" x2="84" y2="44"/>
    <line x1="44" y1="84" x2="31" y2="97"/>
  </g>

  <!-- central lens / eye -->
  <circle cx="64" cy="64" r="20" stroke="url(#g1)" stroke-width="3" fill="#0d0d1a"/>
  <circle cx="64" cy="64" r="10" fill="url(#g1)"/>
  <circle cx="60" cy="60" r="3.5" fill="#fff" opacity=".85"/>

  <!-- circuit traces -->
  <g stroke="#00d4aa" stroke-width="1.2" stroke-linecap="round" opacity=".55">
    <line x1="64" y1="44" x2="64" y2="36"/>
    <line x1="64" y1="44" x2="72" y2="36"/>
    <line x1="64" y1="84" x2="64" y2="92"/>
    <line x1="64" y1="84" x2="56" y2="92"/>
    <line x1="44" y1="64" x2="36" y2="64"/>
    <line x1="44" y1="64" x2="36" y2="56"/>
    <line x1="84" y1="64" x2="92" y2="64"/>
    <line x1="84" y1="64" x2="92" y2="72"/>
  </g>

  <!-- circuit nodes -->
  <g fill="#00d4aa" opacity=".7">
    <circle cx="64" cy="36" r="2.5"/>
    <circle cx="64" cy="92" r="2.5"/>
    <circle cx="36" cy="64" r="2.5"/>
    <circle cx="92" cy="64" r="2.5"/>
  </g>
</svg>
